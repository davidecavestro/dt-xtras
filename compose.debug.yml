services:
  backend:
    extends:
      file: ./compose.build.yml
    build:
      dockerfile: Dockerfile.debug
    network_mode: host
    environment:
      - DT_API_URL=${DT_API_URL}
      - DT_FRONTEND_URL=${DT_FRONTEND_URL}
      - BACKEND_API_URL=${BACKEND_API_URL}
      - TAXONOMIES_FILE=${TAXONOMIES_FILE}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - CORS_ALLOW_METHODS=${CORS_ALLOW_METHODS}
    volumes:
      - ./data:/app/data/taxonomies.yaml
    env_file:
      - .env.debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    extends:
      file: ./compose.build.yml
    network_mode: host
    environment:
      - VITE_API_URL=http://localhost:8001
      - BACKEND_API_URL=${BACKEND_API_URL}
    env_file:
      - .env.debug

taxonomies:
  - id: "customer"
    name: "Customer"
    regex_pattern: '^cust:(?P<id>\w+)$'
    priority: 1

  - id: "env"
    name: "Environment"
    regex_pattern: '^env:(?P<env_type>\w+)$'
    priority: 2

  - id: "deploy"
    name: "Deployment"
    regex_pattern: '^deploy:(?P<env>\w+):(?P<customer>cust:\w+):(?P<product_version>[\w-]+:[\d\.]+)$'
    priority: 3
    relations:
      - group: "env"
        targets: "env"
      - group: "customer"
        targets: "customer"
      - group: "product_version"
        targets: "product_version"

  - id: "product_version"
    name: "Product Version"
    regex_pattern: '^(?!(?:env|cust|deploy):)(?P<product_name>[\w-]+):(?P<version>[\d\w\.-]+)$'
    priority: 4

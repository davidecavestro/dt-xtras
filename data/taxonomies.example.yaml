taxonomies:
- hierarchical: false
  color: '#ff0000'
  id: brand
  name: Brand
  priority: 1
  regex_pattern: ^brand:(?P<value>.+)$
  relations: []
- hierarchical: false
  color: '#b942f0'
  id: region
  name: Region
  priority: 1
  regex_pattern: ^region:(?<id>\w+)$
  relations: []
- hierarchical: false
  color: '#42bcf0'
  id: bundle_version
  name: Bundle version
  priority: 1
  regex_pattern: ^(?!(?:brand|region|bundle|cust|env|deploy):)(?<bundle_name>[\w-]+):(?<version>[\d\w\.-]+)$
  relations: []
- hierarchical: true
  color: '#42f057'
  id: site
  name: Site
  priority: 1
  regex_pattern: ^site:(?<brand>\w+):(?<region>\w+):(?<bundle_version>[\w-]+:[\d\.]+)$
  relations:
  - group: brand
    targets: brand
  - group: region
    targets: region
  - group: bundle_version
    targets: bundle_version

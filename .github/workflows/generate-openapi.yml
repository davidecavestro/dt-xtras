name: "Generate OpenAPI Descriptor"

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/generate-openapi.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-openapi:
    name: "Generate OpenAPI Schema"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10" # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Python"
        uses: "actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405" # v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: "Install backend dependencies"
        run: |
          cd backend
          pip install -r requirements.txt

      - name: "Generate OpenAPI JSON"
        env:
          DT_API_URL: "http://localhost:8080"
          JWT_SECRET_KEY: "dummy"
        run: |
          cd backend
          python -c "import json; from main import app; print(json.dumps(app.openapi(), indent=2))" > openapi.json

      - name: "Check for changes"
        id: check_changes
        run: |
          cd backend
          if git diff --quiet openapi.json; then
            echo "No changes to OpenAPI schema"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "OpenAPI schema has changes"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: "Create Release"
        if: github.event_name == 'push' && steps.check_changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd backend
          VERSION="openapi-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"
          gh release create "$VERSION" \
            --title "OpenAPI Schema $VERSION" \
            --notes "Auto-generated OpenAPI schema from commit ${{ github.sha }}" \
            openapi.json

name: "Generate OpenAPI Descriptor"

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/generate-openapi.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-openapi:
    name: "Generate OpenAPI Schema"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Python"
        uses: "actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405" # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: "Install backend dependencies"
        run: |
          cd backend
          pip install -r requirements.txt

      - name: "Generate OpenAPI JSON"
        env:
          DT_API_URL: "http://localhost:8080"
          DT_API_KEY: "dummy"
          JWT_SECRET_KEY: "dummy"
        run: |
          cd backend
          python -c "import json; from main import app; print(json.dumps(app.openapi(), indent=2))" > openapi.json

      - name: "Check for changes"
        id: check_changes
        run: |
          cd backend
          if git diff --quiet openapi.json; then
            echo "No changes to OpenAPI schema"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "OpenAPI schema has changes"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: "Commit and push changes"
        if: github.event_name == 'push' && steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/openapi.json
          git commit -m "chore: update OpenAPI descriptor [skip ci]"
          git push

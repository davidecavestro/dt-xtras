name: "Continuous Integration"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality-assurance:
    name: "Quality Assurance"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v6"

      - name: "Set up Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: "Install frontend dependencies"
        run: |
          cd frontend
          npm ci

      - name: "Run frontend linting"
        run: |
          cd frontend
          npm run lint 2>/dev/null || echo "No lint script found, skipping"

      - name: "Install backend dependencies"
        run: |
          cd backend
          pip install -r requirements.txt

      - name: "Run backend linting"
        run: |
          cd backend
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Flake8 not configured, skipping"
          python -m black --check . || echo "Black not configured, skipping"

      - name: "Run frontend tests"
        run: |
          cd frontend
          npm test 2>/dev/null || echo "No tests configured, skipping"

      - name: "Run backend tests"
        run: |
          cd backend
          python -m pytest . -v || echo "No tests configured, skipping"

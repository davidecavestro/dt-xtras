name: "Continuous Integration"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality-assurance:
    name: "Quality Assurance"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6

      - name: "Set up Node.js"
        uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: "Set up Python"
        uses: "actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405" # v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: "Install frontend dependencies"
        run: |
          cd frontend
          npm ci

      - name: "Run frontend linting"
        run: |
          cd frontend
          npm run lint 2>/dev/null || echo "No lint script found, skipping"

      - name: "Install backend dependencies"
        run: |
          cd backend
          pip install -r requirements.txt

      - name: "Run backend linting"
        run: |
          cd backend
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Flake8 not configured, skipping"
          python -m black --check . || echo "Black not configured, skipping"

      - name: "Run frontend tests with coverage"
        run: |
          cd frontend
          npm run test:run -- --coverage

      - name: "Upload frontend coverage report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          retention-days: 30

      - name: "Cache Playwright browsers"
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: "Install Playwright browsers"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: "Install Playwright system dependencies (cache hit)"
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          cd frontend
          npx playwright install-deps chromium

      - name: "Build frontend for E2E"
        run: |
          cd frontend
          npm run build

      - name: "Run E2E tests"
        timeout-minutes: 10
        run: |
          cd frontend
          npx playwright test

      - name: "Upload Playwright report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 30

      - name: "Run backend tests with coverage"
        run: |
          cd backend
          python -m pytest . -v --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70

      - name: "Upload backend coverage report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 30

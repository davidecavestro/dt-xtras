name: "Continuous Integration"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  quality-assurance:
    name: "Quality Assurance"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6

      - name: "Set up Node.js"
        uses: "actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f" # v6
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: "Set up Python"
        uses: "actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405" # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: "Install frontend dependencies"
        run: |
          cd frontend
          npm ci

      - name: "Run frontend linting"
        run: |
          cd frontend
          npm run lint 2>/dev/null || echo "No lint script found, skipping"

      - name: "Install backend dependencies"
        run: |
          cd backend
          pip install -r requirements.txt

      - name: "Run backend linting"
        run: |
          cd backend
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Flake8 not configured, skipping"
          python -m black --check . || echo "Black not configured, skipping"

      - name: "Run frontend tests with coverage"
        run: |
          cd frontend
          npm run test:run -- --coverage

      - name: "Upload frontend coverage report"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          retention-days: 30

      - name: "Run backend tests with coverage"
        run: |
          cd backend
          python -m pytest . -v --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70

      - name: "Upload backend coverage report"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 30

name: "Release"

on:
  push:
    tags:
      - v[0-9]+.[0-9]*
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  packages: write
  actions: read
jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5" # v4

      - name: "Login to Container registry"
        uses: "docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee" # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push backend image"
        id: backend_build
        uses: "docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf" # v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }},ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: "Build and push frontend image"
        id: frontend_build
        uses: "docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf" # v7
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }},ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: "Generate Backend SBOM"
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          format: cyclonedx-json
          artifact-name: backend.cdx.json

      - name: "Generate frontend SBOM"
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
          format: cyclonedx-json
          artifact-name: frontend.cdx.json

      - name: "Set up Python"
        uses: "actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405" # v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: "Install backend dependencies"
        run: |
          cd backend
          pip install -r requirements.txt

      - name: "Generate OpenAPI JSON"
        env:
          DT_API_URL: "http://localhost:8080"
          DT_API_KEY: "dummy"
          JWT_SECRET_KEY: "dummy"
        run: |
          cd backend
          python -c "import json; from main import app; print(json.dumps(app.openapi(), indent=2))" > openapi.json

      - name: "Upload OpenAPI artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-schema
          path: backend/openapi.json
          retention-days: 30

      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@b78a3354a01f4a1affb484b9264b506a815c46b1 # v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ github.ref_name }}
          # in the body, show both the changes and the reference to the backend and frontend images
          body: |
            ${{ steps.changelog.outputs.changes }}

            ## Images

            - Backend: ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
            - Frontend: ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}

            ## API Documentation

            - OpenAPI Schema: openapi.json (attached to this release)
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "backend/openapi.json"

      - name: Publish SBOM
        uses: anchore/sbom-action/publish-sbom@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          sbom-artifact-match: ".*\\.cdx\\.json$"

      - name: Commit CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          branch: main
          commit_message: 'docs: update CHANGELOG.md for ${{ github.ref_name }} [skip ci]'
          file_pattern: CHANGELOG.md

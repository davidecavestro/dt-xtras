name: "Coverage Badge"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    name: "Generate Coverage Badge"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6

      - name: "Set up Python"
        uses: "actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405" # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: "Install dependencies"
        run: |
          cd backend
          pip install -r requirements.txt

      - name: "Run tests and generate coverage"
        run: |
          cd backend
          python -m pytest . --cov=main --cov-report=term --cov-report=json:coverage.json

      - name: "Extract coverage percentage"
        id: coverage
        run: |
          cd backend
          COVERAGE=$(python -c "import json; data=json.load(open('coverage.json')); print(round(data['totals']['percent_covered']))")
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: "Update README badge"
        uses: "schneegans/dynamic-badges-action@v1.8.0"
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 609260f0e737a09ab2359c05e6289ea7
          filename: dt-xtras-coverage.json
          label: backend coverage
          message: ${{ steps.coverage.outputs.coverage }}%
          color: ${{ steps.coverage.outputs.coverage > 80 && 'brightgreen' || steps.coverage.outputs.coverage > 60 && 'green' || steps.coverage.outputs.coverage > 40 && 'yellow' || 'red' }}

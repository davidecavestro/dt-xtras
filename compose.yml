version: '3.8'

services:
  backend:
#    build:
#      context: ./backend
#      dockerfile: Dockerfile
    image: ghcr.io/davidecavestro/dt-xtras/backend:latest
    ports:
      - "8000:8000"
    environment:
      - DT_API_URL=${DT_API_URL}
      - DT_FRONTEND_URL=${DT_FRONTEND_URL}
      - BACKEND_API_URL=${BACKEND_API_URL:-http://localhost:8000}
      - TAXONOMIES_FILE=${TAXONOMIES_FILE:-../data/taxonomies.yaml}
    volumes:
      - ./data:/app/data/taxonomies.yaml
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
#    build:
#      context: ./frontend
#      dockerfile: Dockerfile
    image: ghcr.io/davidecavestro/dt-xtras/frontend:latest
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000
    env_file:
      - .env
